name: Generar APK de 1.000 Goles

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  generar-apk:
    name: Compilar APK Android de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Instalar plataforma Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Comprobar archivo HTML del juego
        run: test -s app/src/main/assets/index.html

      - name: Generar APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mil-Goles-APK-Prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
