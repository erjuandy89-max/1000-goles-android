name: Compilar APK - 1000 Goles Neon Matchday

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '1000_Goles_Neon_Matchday_Android_preparado_GitHub.zip'
      - '.github/workflows/build-neon-matchday.yml'

permissions:
  contents: read

jobs:
  neon-android:
    name: APK Neon Matchday (instalacion paralela)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'


      - name: Instalar Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Descomprimir proyecto Neon del ZIP
        run: |
          test -s '1000_Goles_Neon_Matchday_Android_preparado_GitHub.zip'
          mkdir -p temporal
          unzip -q '1000_Goles_Neon_Matchday_Android_preparado_GitHub.zip' -d temporal
          test -f temporal/android/settings.gradle
          test -s temporal/android/app/src/main/assets/index.html
          test -f temporal/android/app/src/main/java/com/erjuandy/goles1000/MainActivity.java

      - name: Ajustar SDK minimo del proyecto de pruebas
        run: |
          sed -i 's/minSdk 23/minSdk 24/' temporal/android/app/build.gradle
          grep -F 'minSdk 24' temporal/android/app/build.gradle
          grep -F "applicationIdSuffix '.neonmatchday'" temporal/android/app/build.gradle

      - name: Verificar archivos y contenido Neon
        run: |
          python3 temporal/android/docs/verificar_proyecto.py
          if grep -q 'Configurar enlace online' temporal/android/app/src/main/assets/index.html; then
            echo 'ERROR: todavia hay configuracion tecnica de enlace online'
            exit 1
          fi

      - name: Compilar APK Neon Matchday
        run: gradle -p temporal/android --no-daemon --stacktrace :app:assembleDebug

      - name: Comprobar APK resultante
        run: |
          test -s temporal/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p temporal/android/app/build/outputs/apk/debug/app-debug.apk assets/index.html | sha256sum
          sha256sum temporal/android/app/src/main/assets/index.html

      - name: Publicar APK Neon descargable
        uses: actions/upload-artifact@v4
        with:
          name: 1000-Goles-Neon-Matchday-APK
          path: temporal/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
