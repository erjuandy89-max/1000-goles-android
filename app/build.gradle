plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juandy.milgoles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.juandy.milgoles.neonpruebas'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1-catalogo-online'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
